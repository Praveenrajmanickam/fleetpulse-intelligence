[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetpulse"
version = "0.1.0"
description = "Heavy-duty truck CAN/J1939 telemetry data engineering"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
# Bronze layer; also needs Java 17 (conda-forge openjdk=17 in the fleetpulse-can env)
spark = ["pyspark==4.2.0", "delta-spark==4.4.0"]
# Dashboard V1 serving API
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
fleetpulse-decode = "fleetpulse.pipelines.decode_can_file:main"
fleetpulse-session = "fleetpulse.pipelines.build_session:main"
fleetpulse-explore = "fleetpulse.pipelines.explore_session:main"
fleetpulse-bronze = "fleetpulse.pipelines.bronze_ingest:main"
fleetpulse-silver = "fleetpulse.pipelines.silver_build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:PySpark does not yet fully support pandas:FutureWarning"]
